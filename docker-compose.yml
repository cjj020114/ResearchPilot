services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RESEARCHPILOT_STORAGE_DIR: /app/storage
      RESEARCHPILOT_UPLOAD_DIR: /app/storage/uploads
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: extractive
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      RESEARCHPILOT_API_BASE: http://api:8000/api
    ports:
      - "8501:8501"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
