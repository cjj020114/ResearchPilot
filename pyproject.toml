[project]
name = "researchpilot"
version = "0.1.0"
description = "Personal research RAG knowledge assistant with hybrid retrieval, reranking, citations, and evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2.0",
  "qdrant-client>=1.9.0",
  "sentence-transformers>=3.0.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "streamlit>=1.36.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "types-requests>=2.32.0",
]
eval = [
  "ragas>=0.1.16",
  "datasets>=2.20.0",
]
# Lightweight parsers for tables/office/markdown helpers.
parsers = [
  "openpyxl>=3.1.0",
  "xlrd>=2.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "Pillow>=10.0.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "markdown-it-py>=3.0.0",
  "openai>=1.40.0",
]
# Heavier document partitioning stack for docx/pptx/html/pdf elements.
unstructured = [
  "unstructured[docx,pptx,md]>=0.15.0",
]
# Convenience extra combining lightweight parsers and unstructured.
docs = [
  "openpyxl>=3.1.0",
  "xlrd>=2.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "Pillow>=10.0.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "markdown-it-py>=3.0.0",
  "openai>=1.40.0",
  "unstructured[docx,pptx,md]>=0.15.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["datasets*", "docs*", "frontend*", "storage*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
